services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rsl_xai
      POSTGRES_USER: rsl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rsl-local-only-password}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - rsl_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rsl -d rsl_xai"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      database:
        condition: service_healthy
    environment:
      RSL_DATABASE_URL: postgresql+psycopg://rsl:${POSTGRES_PASSWORD:-rsl-local-only-password}@database:5432/rsl_xai
      RSL_JWT_SECRET: ${RSL_JWT_SECRET:-development-only-secret-change-before-deployment-32chars}
      RSL_STORAGE_PATH: /data/storage
    ports:
      - "127.0.0.1:8002:8000"
    volumes:
      - rsl_storage_data:/data/storage

volumes:
  rsl_postgres_data:
  rsl_storage_data: